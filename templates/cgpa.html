{% extends "base.html" %}

{% block title %}CGPA Target Calculator - Nexus{% endblock %}

{% block content %}
<div class="page-header">
    <h1>CGPA Target Calculator</h1>
    <p>Calculate the marks required in remaining subjects to hit your target CGPA.</p>
</div>

<div class="module-layout">
    <!-- Calculator Form -->
    <div class="form-panel glass-panel">
        <h3 class="panel-header"><i class="fa-solid fa-bullseye"></i> Set Your Target</h3>
        <form id="cgpa-form">
            <div class="form-group">
                <label for="current_sgpa">Current Total SGPA Points (sum of all semester SGPAs)</label>
                <input type="number" id="current_sgpa" class="form-control" step="0.01" min="0" required
                    placeholder="e.g. 35.5" title="The sum of all SGPA points earned across completed semesters.">
            </div>
            <div class="form-group">
                <label for="semesters_completed">Semesters Completed</label>
                <input type="number" id="semesters_completed" class="form-control" min="1" max="7" required
                    placeholder="e.g. 4" title="Number of semesters already finished.">
            </div>
            <div class="form-group">
                <label for="target_cgpa">Target CGPA (at graduation - 8 semesters total)</label>
                <input type="number" id="target_cgpa" class="form-control" step="0.01" max="10" min="0" required
                    placeholder="e.g. 8.5" title="The CGPA you aim to achieve after 8 semesters.">
            </div>
            <button type="button" onclick="calculateTarget()" class="btn-primary"
                style="width: 100%; margin-top: 1rem;">Calculate Required SGPA</button>
        </form>
    </div>

    <!-- Results Panel -->
    <div class="list-panel glass-panel cgpa-result-panel" id="result-panel">
        <div class="cgpa-result-content">
            <i id="result-icon" class="fa-solid fa-calculator cgpa-result-icon"></i>
            <h3 id="result-title" class="cgpa-result-title">Calculation Result</h3>
            <p id="result-message" class="cgpa-result-message"></p>
            <button type="button" onclick="resetCalculator()" class="glass-btn cgpa-reset-btn">Reset Calculator</button>
        </div>
    </div>
</div>

<script>
    function calculateTarget() {
        const currentPoints = parseFloat(document.getElementById('current_sgpa').value);
        const semsCompleted = parseInt(document.getElementById('semesters_completed').value);
        const targetCgpa = parseFloat(document.getElementById('target_cgpa').value);

        if (isNaN(currentPoints) || isNaN(semsCompleted) || isNaN(targetCgpa)) {
            alert('Please fill in all fields with valid numbers.');
            return;
        }

        const totalSems = 8;
        const semsRemaining = totalSems - semsCompleted;

        if (semsRemaining <= 0) {
            alert('You have already completed all 8 semesters!');
            return;
        }

        // Calculation
        const targetTotalPoints = targetCgpa * totalSems;
        const pointsNeeded = targetTotalPoints - currentPoints;
        const requiredSgpaPerSem = pointsNeeded / semsRemaining;

        // Show result
        const panel = document.getElementById('result-panel');
        const icon = document.getElementById('result-icon');
        const title = document.getElementById('result-title');
        const message = document.getElementById('result-message');

        panel.classList.add('visible');

        const currentCgpa = (currentPoints / semsCompleted).toFixed(2);

        if (requiredSgpaPerSem > 10) {
            icon.className = "fa-solid fa-face-frown";
            icon.style.color = "var(--danger)";
            title.textContent = "Target Unreachable";
            message.innerHTML = `Your current CGPA is <strong>${currentCgpa}</strong>. <br><br>To reach a CGPA of <strong>${targetCgpa}</strong>, you need an average SGPA of <strong style="color:var(--danger)">${requiredSgpaPerSem.toFixed(2)}</strong> in the remaining ${semsRemaining} semesters, which is impossible natively. Try setting a more realistic target.`;
        } else if (requiredSgpaPerSem <= 0) {
            icon.className = "fa-solid fa-face-laugh-beam";
            icon.style.color = "var(--success)";
            title.textContent = "Target Already Met!";
            message.innerHTML = `Your current CGPA is <strong>${currentCgpa}</strong>. <br><br>You have already secured enough points to maintain a ${targetCgpa} CGPA even if you score barely passing marks!`;
        } else {
            icon.className = "fa-solid fa-bullseye";
            icon.style.color = "var(--warning)";
            title.textContent = "Target Achievable";
            message.innerHTML = `Your current CGPA is <strong>${currentCgpa}</strong>. <br><br>You need to maintain an average SGPA of <strong style="color:var(--warning); font-size:1.5rem;">${requiredSgpaPerSem.toFixed(2)}</strong> across your remaining ${semsRemaining} semesters to hit your target of ${targetCgpa} CGPA.`;
        }
    }

    function resetCalculator() {
        document.getElementById('cgpa-form').reset();
        document.getElementById('result-panel').classList.remove('visible');
        document.getElementById('current_sgpa').focus();
    }
</script>
{% endblock %}
